# XcodeGen spec — the .xcodeproj is generated (`just ios-gen`) and not committed.
name: Zone2
options:
  bundleIdPrefix: day.zone2
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Free Personal Team of the athlete's Apple ID (profiles expire in 7 days → `just resign`).
    DEVELOPMENT_TEAM: HNC3JK7XK2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  Zone2Core:
    path: Packages
targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Zone2Core
        product: Zone2Kit
      - package: Zone2Core
        product: Zone2UI
    info:
      path: Config/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: $(ZONE2_DISPLAY_NAME)
        CFBundleLocalizations: [en, ru]
        # Brand launch: the white "2" from the icon on its orange (App/Assets.xcassets).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: zone2.day reads your workouts, heart rate, routes and recovery metrics to sync them with your coach.
        NSHealthUpdateUsageDescription: zone2.day saves indoor rides (e.g. MyWhoosh) to Apple Health.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [day.zone2.app.refresh, day.zone2.app.processing]
        # Which backend this copy talks to (AppEnvironment.serverURL) and whether it puts the plan
        # on the watch by default (two copies would otherwise schedule two plans).
        Zone2ServerURL: $(ZONE2_SERVER_URL)
        Zone2WatchDeliveryDefault: $(ZONE2_WATCH_DELIVERY)
    entitlements:
      path: Config/Zone2.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        # Brand orange (#FF5A1F, Apple Watch Ultra's International Orange) — App/Assets.xcassets.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: $(ZONE2_APP_ICON)

# Two copies side by side on the phone (own sign-in, database and Health permission each):
# zone2 → prod, zone2 stg → staging. `just ios-device` / `just ios-device stg`.
targets:
  Zone2:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.zone2.app
        ZONE2_DISPLAY_NAME: zone2
        ZONE2_SERVER_URL: https:/$()/api.zone2.day
        ZONE2_WATCH_DELIVERY: YES
        ZONE2_APP_ICON: AppIcon
    dependencies:
      - target: Zone2Watch
  Zone2Stg:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.zone2.app.stg
        ZONE2_DISPLAY_NAME: zone2 stg
        ZONE2_SERVER_URL: https:/$()/api-staging.zone2.day
        ZONE2_WATCH_DELIVERY: NO
        # Same stencil mark with a graphite upper-right corner to distinguish staging.
        ZONE2_APP_ICON: AppIconStg

  # Zone2 Watch: heart-rate companion for the trainer (docs/11-trainer.md §4, spike S9). Embedded in
  # the prod copy only (Personal Team: 10 app IDs a week).
  Zone2Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Config/Zone2Watch-Info.plist
      properties:
        CFBundleDisplayName: zone2
        WKApplication: true
        WKCompanionAppBundleIdentifier: day.zone2.app
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: zone2.day reads your heart rate during a ride to show it on the iPhone.
        NSHealthUpdateUsageDescription: zone2.day saves your rides with heart rate, power and cadence to Apple Health.
    entitlements:
      path: Config/Zone2Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.zone2.app.watchkitapp

  # zone2 Ride (Mac): overlay for trainer rides — power/cadence from the trainer (FTMS), heart rate
  # from HeartCast on the iPhone (BLE 0x180D), 1 Hz record. docs/11-trainer.md. `just ride`.
  Zone2Ride:
    type: application
    platform: macOS
    sources:
      - path: Ride
    dependencies:
      - package: Zone2Core
        product: TrainerKit
      - package: Zone2Core
        product: Zone2Kit
    info:
      path: Config/Zone2Ride-Info.plist
      properties:
        CFBundleDisplayName: zone2 Ride
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Accessory app: no Dock icon, so the overlay can sit over other apps' full-screen video.
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: zone2 Ride connects to your smart trainer and heart-rate sensor.
        # Prod by default; `defaults write day.zone2.ride ServerURL https://api-staging.zone2.day` for staging.
        Zone2ServerURL: https://api.zone2.day
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: day.zone2.ride
        # Runs locally only, no sandbox, no provisioning profile. Signed with the Apple Development
        # certificate (not ad-hoc) so macOS keeps the Bluetooth permission across rebuilds.
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: HNC3JK7XK2
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
