# zone2.day CI: tests on every push/PR; push to main deploys staging (docs/08-dev-harness.md §7).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: "2.7.1"
  SUPABASE_CLI_VERSION: "3.1.0"
  STAGING_REF: udlqrxzuzoygmulwptee
  STAGING_URL: https://api-staging.zone2.day

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ZONE2_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Type check
        run: deno check backend/src backend/tests edge-proxy/src supabase/functions/api/index.ts
      - name: Lint and format
        run: deno lint && deno fmt --check
      - name: Tests (backend + edge proxy, real Postgres)
        run: deno test --allow-net --allow-env --allow-read --allow-write=/tmp

  deploy-staging:
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$STAGING_DB_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: set SUPABASE_ACCESS_TOKEN and STAGING_DB_PASSWORD repository secrets"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --yes --remote="$STAGING_REF" -p "$STAGING_DB_PASSWORD"
      - name: Deploy function (version baked into the bundle)
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "export const BUILD_VERSION = \"${GITHUB_SHA::7}\";" > supabase/functions/api/build.ts
          supabase functions deploy api --yes --remote="$STAGING_REF"
      - name: Smoke
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 20 "$STAGING_URL/health" || true)
            if [[ "$body" == *"${GITHUB_SHA::7}"* ]]; then echo "$body"; exit 0; fi
            sleep 5
          done
          echo "::error::staging did not report ${GITHUB_SHA::7}: $body"; exit 1
